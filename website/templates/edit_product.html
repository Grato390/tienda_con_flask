{% extends 'base.html' %}

{% block title %}Editar Producto{% endblock %}

{% block body %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3>Editar Producto: {{ product.product_name }}</h3>
                    <button onclick="confirmDelete({{ product.id }})" class="btn btn-danger">
                        <i class="fa fa-trash"></i> Eliminar Producto
                    </button>
                </div>
                
                <!-- Add at the bottom of the template -->
                <!-- Delete Confirmation Modal -->
                <div class="modal fade" id="deleteModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirmar Eliminación</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                ¿Está seguro que desea eliminar este producto?
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <a id="deleteLink" href="" class="btn btn-danger">Eliminar</a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <script>
                function confirmDelete(productId) {
                    document.getElementById('deleteLink').href = '/delete-product/' + productId;
                    new bootstrap.Modal(document.getElementById('deleteModal')).show();
                }
                </script>
                
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-md-4">
                                <img src="{{ product.product_picture }}" alt="{{ product.product_name }}" 
                                     class="img-fluid rounded mb-3" style="max-height: 200px;">
                                <div class="mb-3">
                                    <label class="form-label">Cambiar Imagen</label>
                                    <input type="file" name="product_picture" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label class="form-label">Nombre del Producto</label>
                                    <input type="text" name="product_name" class="form-control" 
                                           value="{{ product.product_name }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Precio Actual</label>
                                    <input type="number" step="0.01" name="current_price" 
                                           class="form-control" value="{{ product.current_price }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Precio Anterior</label>
                                    <input type="number" step="0.01" name="previous_price" 
                                           class="form-control" value="{{ product.previous_price }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Stock Disponible</label>
                                    <input type="number" name="in_stock" class="form-control" 
                                           value="{{ product.in_stock }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Categoría</label>
                                    <select name="category_id" class="form-control" required>
                                        {% for category in categories %}
                                        <option value="{{ category.id }}" 
                                            {% if category.id == product.category_id %}selected{% endif %}>
                                            {{ category.name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" name="flash_sale" 
                                           id="flash_sale" {% if product.flash_sale %}checked{% endif %}>
                                    <label class="form-check-label" for="flash_sale">Oferta Flash</label>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                    <a href="/" class="btn btn-secondary">Cancelar</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
